<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto" role="img" aria-labelledby="nq-hero-title nq-hero-desc">
  <title id="nq-hero-title">Nafis Quaisar — Android Developer &amp; Software Engineer</title>
  <desc id="nq-hero-desc">Cinematic burgundy identity banner with fine technical grid, restrained orbital geometry, and animated luminous gradients.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="45%" stop-color="#190B12" />
      <stop offset="85%" stop-color="#451126" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <!-- Radial Ambient Atmosphere -->
    <radialGradient id="nq-ambient-glow" cx="82%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#451126" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nq-ambient-secondary" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#190B12" stop-opacity="0" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="nq-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5B5C7" stroke-width="0.75" stroke-opacity="0.06" />
      <circle cx="0" cy="0" r="1" fill="#C77B9B" fill-opacity="0.18" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="nq-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="nq-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Moving Beam Gradient -->
    <linearGradient id="nq-beam-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0" />
      <stop offset="50%" stop-color="#E5B5C7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;100%" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="7s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Underline Pulse Gradient -->
    <linearGradient id="nq-underline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C77B9B" />
      <stop offset="50%" stop-color="#E5B5C7" />
      <stop offset="100%" stop-color="#701A3D" />
    </linearGradient>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform {
        display: none !important;
      }
    }
  </style>

  <!-- Base Canvas & Frame -->
  <rect width="1200" height="380" rx="20" fill="url(#nq-bg)" />
  <rect width="1200" height="380" rx="20" fill="url(#nq-grid)" />
  <rect width="1200" height="380" rx="20" fill="url(#nq-ambient-glow)" />
  <rect width="1200" height="380" rx="20" fill="url(#nq-ambient-secondary)" />

  <!-- Outer Border with subtle metallic sheen -->
  <rect x="1" y="1" width="1198" height="378" rx="19" fill="none" stroke="#701A3D" stroke-width="1.2" stroke-opacity="0.55" />
  <rect x="3" y="3" width="1194" height="374" rx="17" fill="none" stroke="#C77B9B" stroke-width="0.6" stroke-opacity="0.25" />

  <!-- Restrained Orbital Geometry & Technical Schematics (Right Wing) -->
  <g id="nq-orbital-system" transform="translate(950, 190)">
    <!-- Deep Ambient Orbital Sphere -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#701A3D" stroke-width="1" stroke-opacity="0.35" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="#C77B9B" stroke-width="1.2" stroke-opacity="0.22" stroke-dasharray="3 8" />
    
    <!-- Rotating Celestial Track 1 -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#E5B5C7" stroke-width="1" stroke-opacity="0.28" stroke-dasharray="14 36">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="45s" repeatCount="indefinite" />
    </circle>
    
    <!-- Rotating Celestial Track 2 (Counter-Clockwise) -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#C77B9B" stroke-width="1.5" stroke-opacity="0.38" stroke-dasharray="45 15 10 20">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="32s" repeatCount="indefinite" />
    </circle>

    <!-- Center Core Nodes -->
    <circle cx="0" cy="0" r="32" fill="#190B12" stroke="#701A3D" stroke-width="1.5" />
    <circle cx="0" cy="0" r="12" fill="#451126" stroke="#E5B5C7" stroke-width="1" filter="url(#nq-glow)">
      <animate attributeName="r" values="10;14;10" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Satellite Orbital Node -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite" />
      <circle cx="105" cy="0" r="4.5" fill="#F8F0F3" filter="url(#nq-glow)" />
      <circle cx="105" cy="0" r="8" fill="none" stroke="#E5B5C7" stroke-width="0.8" stroke-opacity="0.6" />
    </g>

    <!-- Crosshair Ticks -->
    <line x1="-175" y1="0" x2="-145" y2="0" stroke="#C77B9B" stroke-opacity="0.3" stroke-width="1" />
    <line x1="145" y1="0" x2="175" y2="0" stroke="#C77B9B" stroke-opacity="0.3" stroke-width="1" />
    <line x1="0" y1="-175" x2="0" y2="-145" stroke="#C77B9B" stroke-opacity="0.3" stroke-width="1" />
    <line x1="0" y1="145" x2="0" y2="175" stroke="#C77B9B" stroke-opacity="0.3" stroke-width="1" />
  </g>

  <!-- Flowing Architectural Light Ray / Spline -->
  <path d="M 680 40 C 820 110, 810 240, 1020 280 S 1150 210, 1200 220" fill="none" stroke="url(#nq-beam-gradient)" stroke-width="2.5" filter="url(#nq-soft-glow)" />
  <path d="M 620 70 C 780 140, 860 190, 1080 170 S 1160 140, 1200 150" fill="none" stroke="#C77B9B" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="6 8" />

  <!-- Left Header Status Pill -->
  <g transform="translate(70, 48)">
    <rect x="0" y="0" width="355" height="28" rx="14" fill="#190B12" stroke="#701A3D" stroke-width="1" />
    <circle cx="14" cy="14" r="4.5" fill="#C77B9B" filter="url(#nq-soft-glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#E5B5C7">
      SYSTEMS &amp; MOBILE ENGINEERING
    </text>
  </g>

  <!-- Identity & Editorial Typography -->
  <text x="70" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Cinzel', 'Playfair Display', Georgia, sans-serif" font-weight="700" font-size="64" letter-spacing="-0.5" fill="#F8F0F3">
    Nafis Quaisar
  </text>

  <!-- Glowing Underline Accent with Motion -->
  <g transform="translate(70, 168)">
    <!-- Base track -->
    <line x1="0" y1="0" x2="380" y2="0" stroke="#701A3D" stroke-width="2" stroke-opacity="0.4" />
    <!-- Dynamic glowing sweep -->
    <line x1="0" y1="0" x2="260" y2="0" stroke="url(#nq-underline-grad)" stroke-width="3" stroke-linecap="round" filter="url(#nq-soft-glow)">
      <animate attributeName="x1" values="0;120;0" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="240;380;240" dur="6s" repeatCount="indefinite" />
    </line>
    <circle cx="380" cy="0" r="3" fill="#E5B5C7" filter="url(#nq-soft-glow)" />
  </g>

  <!-- Role Positioning Line -->
  <text x="70" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#E5B5C7" letter-spacing="0.3">
    Android Developer &amp; Software Engineer <tspan fill="#C77B9B">|</tspan> Full-Stack Developer <tspan fill="#C77B9B">|</tspan> Creative Technologist
  </text>

  <!-- Context / Education Subtext -->
  <text x="70" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#C77B9B" letter-spacing="0.2">
    B.Tech Computer Science (LNCT Bhopal) • Production Apps on Google Play • Scalable Systems
  </text>

  <!-- Micro Technical Tags / Verified Metrics Bar -->
  <g transform="translate(70, 290)">
    <!-- Item 1: GATE Target Icon -->
    <rect x="0" y="0" width="176" height="32" rx="6" fill="#190B12" stroke="#451126" stroke-width="1" />
    <g transform="translate(12, 8)">
      <circle cx="8" cy="8" r="7" fill="none" stroke="#C77B9B" stroke-width="1.2" />
      <circle cx="8" cy="8" r="4" fill="none" stroke="#E5B5C7" stroke-width="1" />
      <circle cx="8" cy="8" r="1.5" fill="#F8F0F3" />
    </g>
    <text x="34" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#F8F0F3">
      GATE CS '26 Qualified
    </text>

    <!-- Item 2: DSA Bolt Icon -->
    <rect x="188" y="0" width="160" height="32" rx="6" fill="#190B12" stroke="#451126" stroke-width="1" />
    <g transform="translate(200, 8)">
      <polygon points="9 1, 4 9, 8 9, 7 15, 12 7, 8 7" fill="#E5B5C7" />
    </g>
    <text x="218" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#F8F0F3">
      838+ DSA Solved
    </text>

    <!-- Item 3: Apps Device Icon -->
    <rect x="360" y="0" width="186" height="32" rx="6" fill="#190B12" stroke="#451126" stroke-width="1" />
    <g transform="translate(372, 8)">
      <rect x="3" y="1" width="10" height="14" rx="2" fill="none" stroke="#E5B5C7" stroke-width="1.2" />
      <circle cx="8" cy="12.5" r="0.8" fill="#F8F0F3" />
    </g>
    <text x="392" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#F8F0F3">
      Google Play Publisher
    </text>

    <!-- Item 4: CGPA Cap Icon -->
    <rect x="558" y="0" width="144" height="32" rx="6" fill="#190B12" stroke="#451126" stroke-width="1" />
    <g transform="translate(570, 8)">
      <polygon points="8 3, 15 6.5, 8 10, 1 6.5" fill="#E5B5C7" />
      <path d="M4 8.5 V 12 C 5.5 13.5, 10.5 13.5, 12 12 V 8.5" fill="none" stroke="#C77B9B" stroke-width="1" />
      <line x1="13.5" y1="7.5" x2="13.5" y2="12.5" stroke="#E5B5C7" stroke-width="1" />
    </g>
    <text x="590" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#F8F0F3">
      CGPA 8.36 / 10
    </text>
  </g>

  <!-- Subtle Bottom Circuit Accent -->
  <path d="M 70 350 H 340 L 360 370 H 520" fill="none" stroke="#701A3D" stroke-width="1" stroke-opacity="0.6" />
  <circle cx="520" cy="370" r="2.5" fill="#E5B5C7" />
  <text x="70" y="342" font-family="'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="11" fill="#C77B9B" letter-spacing="1.5">
    ARCHITECT // BUILD // OPTIMIZE // SHIP
  </text>
</svg>
