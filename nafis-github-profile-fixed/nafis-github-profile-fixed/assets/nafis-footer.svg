<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="100%" height="auto" role="img" aria-labelledby="nq-footer-title nq-footer-desc">
  <title id="nq-footer-title">Nafis Quaisar Profile Footer</title>
  <desc id="nq-footer-desc">A minimal cinematic burgundy wave and glowing technical accent line.</desc>
  <defs>
    <linearGradient id="nq-footer-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="30%" stop-color="#190B12" />
      <stop offset="50%" stop-color="#451126" />
      <stop offset="70%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <linearGradient id="nq-footer-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0" />
      <stop offset="25%" stop-color="#C77B9B" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#E5B5C7" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#C77B9B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0" />
    </linearGradient>

    <filter id="nq-footer-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform {
        display: none !important;
      }
    }
  </style>

  <!-- Flowing Architectural Ribbon -->
  <path d="M 0 35 C 220 75, 420 15, 600 35 C 780 55, 980 10, 1200 35 V 110 H 0 Z" fill="url(#nq-footer-bg)" opacity="0.95" />
  
  <!-- Glowing Contoured Top Stroke -->
  <path d="M 0 35 C 220 75, 420 15, 600 35 C 780 55, 980 10, 1200 35" fill="none" stroke="url(#nq-footer-line-grad)" stroke-width="1.8" filter="url(#nq-footer-glow)" />

  <!-- Subtle Harmonic Twin Path -->
  <path d="M 0 48 C 240 85, 440 28, 600 48 C 760 68, 960 25, 1200 48" fill="none" stroke="#701A3D" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="4 8" />

  <!-- Technical Axis Ticks -->
  <line x1="120" y1="80" x2="440" y2="80" stroke="#701A3D" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="440" cy="80" r="2" fill="#C77B9B" fill-opacity="0.6" />
  
  <line x1="760" y1="80" x2="1080" y2="80" stroke="#701A3D" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="760" cy="80" r="2" fill="#C77B9B" fill-opacity="0.6" />

  <!-- Central Pulse Orb & Halo -->
  <g transform="translate(600, 78)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#C77B9B" stroke-width="0.8" stroke-opacity="0.4">
      <animate attributeName="r" values="10;18;10" dur="4s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="7" fill="#451126" stroke="#E5B5C7" stroke-width="1.2" filter="url(#nq-footer-glow)" />
    <circle cx="0" cy="0" r="3" fill="#F8F0F3">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
